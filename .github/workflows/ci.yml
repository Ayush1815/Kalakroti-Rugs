name: Kalakroti Rugs CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils libproj-dev gdal-bin
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f aura_backend/requirements.txt ]; then pip install -r aura_backend/requirements.txt; fi
        pip install black flake8 pillow django-redis
        
    - name: Lint with black
      run: |
        black --check aura_backend/ --exclude='aura_backend/api/migrations/' || true
        
    - name: Lint with flake8
      run: |
        flake8 aura_backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run Django Tests
      env:
        SECRET_KEY: 'test-secret-key-kalakroti-ci'
        DEBUG: 'True'
        REDIS_URL: ''
      run: |
        cd aura_backend
        python manage.py test
